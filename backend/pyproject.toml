# 后端静态检查配置（ruff + mypy）。
# 接入策略见 docs/OPTIMIZATION_ROADMAP.md：
#   - ruff 为“硬门禁”，当前存量违规通过下方 ignore 债务清单 grandfather，逐条修复后删除对应行。
#   - mypy 为“硬门禁”，存量问题已清零，并检查未注解函数体与 Any 返回泄漏。

[tool.ruff]
line-length = 120
target-version = "py312"
# 只检查后端源码；生成物/虚拟环境不参与。
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# 有意义的规则集：pyflakes(F)/pycodestyle(E,W)/isort(I)/pyupgrade(UP)/
# flake8-bugbear(B)/comprehensions(C4)/simplify(SIM)/flake8-pie(PIE)。
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE"]

# ── 债务清单（grandfather）──────────────────────────────────────────────
# 189 处可自动修的违规已由 `ruff check --fix` 清除（import 排序、typing 现代化、
# datetime.UTC、TimeoutError 等，行为等价、测试 77 passed 验证）。
# B023（循环变量闭包捕获）经人工核查全部为误报，已在源码逐行 `# noqa: B023` 标注原因，
# 因此 B023 保持强制启用，不在此豁免——未来其它闭包若命中会被拦下。
# 非格式类债务已清零；E501 单独保留，等待一次可审阅的全量格式化。
ignore = [
    "E501",    # [67] 行过长——待格式化收敛（可 `ruff format` 处理）
]

[tool.ruff.lint.per-file-ignores]
# 测试可放宽风格与部分 bugbear 约束。
"../tests/**" = ["E501", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# 渐进式：第三方库多无 stub，忽略缺失 import 以聚焦自有代码。
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
warn_return_any = true
# 所有函数补全签名后再打开：
#   disallow_untyped_defs = true

# Mixin packages share attributes via ChatDatabase / SessionOrchestrator
# composition. Cross-mixin `self._lock` / `self.session_id` lookups are
# valid at runtime but not visible on the isolated mixin class.
[[tool.mypy.overrides]]
module = [
    "app.services.db.*",
    "app.services.orchestrator.context",
    "app.services.orchestrator.plan",
    "app.services.orchestrator.receipts",
    "app.services.orchestrator.run",
    "app.services.orchestrator.stream_exec",
    "app.services.orchestrator.stream_plan",
    "app.services.orchestrator.stream_plan_batch",
    "app.services.orchestrator.stream_plan_ready",
    "app.services.orchestrator.stream_invoke",
    "app.services.orchestrator.stream_provider",
    "app.services.orchestrator.stream_pseudo",
    "app.services.orchestrator.stream_tools",
    "app.services.orchestrator.stream_turns",
    "app.services.orchestrator.tools",
]
disable_error_code = ["attr-defined", "has-type", "assignment", "no-any-return", "index", "union-attr"]
