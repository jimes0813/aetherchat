# Optional local helpers for the desktop app.
# AetherChat persists chat/state in SQLite; Postgres and MinIO are not used.
# Bind only to loopback so this file cannot accidentally expose services.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  # Optional: run the API without Electron. The packaged desktop app
  # starts its own backend and does not use this service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      AETHERCHAT_ENABLE_DEMO_AUTH: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redisdata:
