name: build-test-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  PYTHON_VERSION: '3.12'
  SOURCE_DATE_EPOCH: '1784160000'

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    outputs:
      is_rc: ${{ steps.classify.outputs.is_rc }}
      include_windows: ${{ steps.classify.outputs.include_windows }}
      release_mode: ${{ steps.classify.outputs.release_mode }}
      matrix: ${{ steps.classify.outputs.matrix }}
    env:
      WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      RELEASE_PRIVATE_KEY: ${{ secrets.AETHERCHAT_RELEASE_PRIVATE_KEY_B64 }}
      RELEASE_PUBLIC_KEY: ${{ secrets.AETHERCHAT_RELEASE_PUBLIC_KEY_B64 }}
    steps:
      - name: Classify tag and validate signing secrets
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          is_tag=false
          is_rc=false
          include_windows=true
          release_mode=branch

          linux_matrix='[{"target":"linux-x64","os":"ubuntu-24.04","platform":"linux","arch":"x64"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]'
          windows_leg='{"target":"windows-x64","os":"windows-2025","platform":"windows","arch":"x64"}'
          full_matrix=$(python3 -c "import json,sys; a=json.loads(sys.argv[1]); a.append(json.loads(sys.argv[2])); print(json.dumps(a))" "$linux_matrix" "$windows_leg")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            is_tag=true
            tag="${GITHUB_REF_NAME}"
            # Prerelease / RC: v0.2.0-rc.1, v1.0.0-rc.2, etc.
            if [[ "$tag" == *-rc* ]] || [[ "$tag" == *rc.[0-9]* ]]; then
              is_rc=true
              release_mode=linux_rc
            else
              release_mode=stable
            fi
          fi

          if [[ "$is_tag" != "true" ]]; then
            echo "Branch/PR validation does not publish release artifacts."
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            echo "include_windows=true" >> "$GITHUB_OUTPUT"
            echo "release_mode=branch" >> "$GITHUB_OUTPUT"
            echo "matrix=${full_matrix}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # All tag releases need Ed25519 update-signing keys.
          missing_ed=()
          for name in RELEASE_PRIVATE_KEY RELEASE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then missing_ed+=("$name"); fi
          done
          if [ "${#missing_ed[@]}" -ne 0 ]; then
            printf 'Signed release is blocked; missing Ed25519 secret(s): %s\n' "${missing_ed[*]}" >&2
            exit 1
          fi

          has_windows=false
          if [ -n "${WINDOWS_CSC_LINK:-}" ] && [ -n "${WINDOWS_CSC_KEY_PASSWORD:-}" ]; then
            has_windows=true
          fi

          if [[ "$is_rc" == "true" ]]; then
            if [[ "$has_windows" == "true" ]]; then
              include_windows=true
              release_mode=full_rc
              matrix_json="$full_matrix"
              echo "RC tag with Windows CSC: full multi-platform signed release."
            else
              include_windows=false
              release_mode=linux_rc
              matrix_json="$linux_matrix"
              echo "RC tag without Windows CSC: Linux-first Ed25519-signed release (Windows skipped)."
            fi
          else
            # Stable tags always require Authenticode + Ed25519.
            missing_win=()
            for name in WINDOWS_CSC_LINK WINDOWS_CSC_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then missing_win+=("$name"); fi
            done
            if [ "${#missing_win[@]}" -ne 0 ]; then
              printf 'Stable signed release is blocked; missing secret(s): %s\n' "${missing_win[*]}" >&2
              exit 1
            fi
            include_windows=true
            release_mode=stable
            matrix_json="$full_matrix"
            echo "Stable tag: all Authenticode and Ed25519 secrets configured."
          fi

          echo "is_rc=${is_rc}" >> "$GITHUB_OUTPUT"
          echo "include_windows=${include_windows}" >> "$GITHUB_OUTPUT"
          echo "release_mode=${release_mode}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  build:
    needs: release-preflight
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-preflight.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      AETHERCHAT_ALLOW_UNAUTHENTICATED: '1'
      CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      # Code-sign Windows only when CSC is present (stable always; RC when secrets set).
      AETHERCHAT_REQUIRE_CODE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release-preflight.outputs.include_windows == 'true' && '1' || '0' }}
      AETHERCHAT_RELEASE_PUBLIC_KEY_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AETHERCHAT_RELEASE_PUBLIC_KEY_B64 || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag and package version identity
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(node -p "require('./frontend/package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install Python dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Install backend lint/type tooling
        if: matrix.target == 'linux-x64'
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Install Playwright Linux system dependencies
        if: matrix.platform == 'linux'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Backend lint (ruff)
        if: matrix.target == 'linux-x64'
        run: ruff check --config backend/pyproject.toml backend/app tests scripts
      - name: Diff hygiene
        if: matrix.target == 'linux-x64'
        env:
          AETHERCHAT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check_diff_hygiene.sh
      - name: Module boundary budgets
        if: matrix.target == 'linux-x64'
        run: bash scripts/check_module_boundaries.sh
      - name: Backend type check (mypy)
        if: matrix.target == 'linux-x64'
        working-directory: backend
        run: mypy
      - name: Backend tests
        run: python -m pytest -q
      - name: Knowledge RAG Recall@K gate
        if: matrix.target == 'linux-x64'
        run: python scripts/run_knowledge_rag_eval.py
      - name: Public RC preflight (secrets checklist)
        if: matrix.target == 'linux-x64'
        run: python scripts/public_rc_preflight.py
      - name: Electron supply-chain tests
        working-directory: frontend
        run: npm run test:electron
      - name: Frontend i18n coverage
        if: matrix.target == 'linux-x64'
        working-directory: frontend
        run: npm run check:i18n
      - name: Frontend unit and component tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Embed release verification public key (Linux)
        if: matrix.platform == 'linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test -n "$AETHERCHAT_RELEASE_PUBLIC_KEY_B64"
          printf '%s' "$AETHERCHAT_RELEASE_PUBLIC_KEY_B64" | base64 --decode > frontend/electron/update-public-key.pem
      - name: Embed release verification public key (Windows)
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:AETHERCHAT_RELEASE_PUBLIC_KEY_B64) { throw "Release public key secret is missing" }
          [IO.File]::WriteAllBytes("frontend/electron/update-public-key.pem", [Convert]::FromBase64String($env:AETHERCHAT_RELEASE_PUBLIC_KEY_B64))

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        working-directory: frontend
        run: ./build-linux.sh
      - name: Verify Linux package layout and Chromium sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          deb=$(find frontend/release -maxdepth 1 -name '*.deb' -print -quit)
          appimage=$(find frontend/release -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$deb" && test -n "$appimage"
          dpkg-deb --info "$deb" >/dev/null
          dpkg-deb --contents "$deb" | grep -- '-rwsr-xr-x root/root .*chrome-sandbox'
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/aetherchat-frontend
      - name: Clean-install Linux package and verify the production sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          deb=$(find frontend/release -maxdepth 1 -name '*.deb' -print -quit)
          deb=$(realpath "$deb")
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils "$deb"
          xvfb-run --auto-servernum scripts/smoke_linux_install.sh
      - name: Build Windows NSIS package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: frontend/build-windows.ps1
      - name: Windows install/upgrade/uninstall smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/release/AetherChat-Setup-*.exe | Select-Object -First 1
          scripts/smoke_windows_install.ps1 $installer.FullName

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          python scripts/release_security.py sbom --npm-lock frontend/package-lock.json --requirements backend/requirements.txt --version "$version" --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output "release-meta/AetherChat-$version-${{ matrix.target }}.cdx.json"
      - name: Generate Linux build metadata
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          args=()
          while IFS= read -r file; do args+=(--artifact "$file"); done < <(find frontend/release -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' \) -type f)
          python scripts/release_security.py metadata --version "$version" --platform linux --arch "${{ matrix.arch }}" --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${args[@]}" --output "release-meta/AetherChat-$version-${{ matrix.target }}.build.json"
      - name: Generate Windows build metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./frontend/package.json').version"
          $installer = Get-ChildItem frontend/release/AetherChat-Setup-*.exe | Select-Object -First 1
          python scripts/release_security.py metadata --version $version --platform windows --arch x64 --timestamp (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") --artifact $installer.FullName --output "release-meta/AetherChat-$version-windows-x64.build.json"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: AetherChat-${{ matrix.target }}
          if-no-files-found: error
          path: |
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/AetherChat-Setup-*.exe
            frontend/release/*.blockmap
            release-meta/*.json
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="AetherChat $GITHUB_REF_NAME"
          if [[ "${{ needs.release-preflight.outputs.release_mode }}" == "linux_rc" ]]; then
            title="AetherChat $GITHUB_REF_NAME (Linux RC)"
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "${{ needs.release-preflight.outputs.is_rc }}" == "true" ]]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$title" --generate-notes
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --generate-notes
            fi
          fi
          shopt -s nullglob
          files=(
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/AetherChat-Setup-*.exe
            frontend/release/*.blockmap
            release-meta/*.json
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release packages found to upload" >&2
            exit 1
          fi
          # Release assets are immutable. A rerun must fail instead of silently
          # replacing a package that already has this version and filename.
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AETHERCHAT_RELEASE_PRIVATE_KEY_B64: ${{ secrets.AETHERCHAT_RELEASE_PRIVATE_KEY_B64 }}
      AETHERCHAT_RELEASE_PUBLIC_KEY_B64: ${{ secrets.AETHERCHAT_RELEASE_PUBLIC_KEY_B64 }}
      INCLUDE_WINDOWS: ${{ needs.release-preflight.outputs.include_windows }}
      RELEASE_MODE: ${{ needs.release-preflight.outputs.release_mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install cryptography==49.0.0
      - name: Download packages from GitHub Release
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
      - name: Create and verify signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AETHERCHAT_RELEASE_PRIVATE_KEY_B64"
          test -n "$AETHERCHAT_RELEASE_PUBLIC_KEY_B64"
          version="${GITHUB_REF_NAME#v}"
          linux_x64=$(find release-assets \( -name '*linux-x86_64.AppImage' -o -name '*linux-x64.AppImage' \) | head -n1)
          linux_arm64=$(find release-assets -name '*linux-arm64.AppImage' | head -n1)
          windows_x64=$(find release-assets -name 'AetherChat-Setup-*.exe' | head -n1 || true)
          test -n "$linux_x64" && test -f "$linux_x64"
          test -n "$linux_arm64" && test -f "$linux_arm64"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          args=(
            --version "$version"
            --release "linux,x64,$linux_x64,$base/$(basename "$linux_x64")"
            --release "linux,arm64,$linux_arm64,$base/$(basename "$linux_arm64")"
          )
          if [[ "${INCLUDE_WINDOWS}" == "true" ]]; then
            test -n "$windows_x64" && test -f "$windows_x64"
            args+=(--release "windows,x64,$windows_x64,$base/$(basename "$windows_x64")")
          else
            echo "Linux-first RC: omitting Windows from update manifest (mode=${RELEASE_MODE})."
          fi
          python scripts/release_security.py manifest "${args[@]}" --output release-assets/update-manifest.json
          python scripts/release_security.py sign --manifest release-assets/update-manifest.json --output release-assets/update-manifest.signed.json
          python scripts/release_security.py verify --envelope release-assets/update-manifest.signed.json
          find release-assets -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          title="AetherChat $GITHUB_REF_NAME"
          notes_flag=(--generate-notes)
          if [[ "${RELEASE_MODE}" == "linux_rc" ]]; then
            title="AetherChat $GITHUB_REF_NAME (Linux RC)"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            true
          else
            # RC tags are prereleases; stable tags are full releases.
            if [[ "${{ needs.release-preflight.outputs.is_rc }}" == "true" ]]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$title" "${notes_flag[@]}"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" "${notes_flag[@]}"
            fi
          fi
          # Upload artifacts (may live in nested dirs from download-artifact).
          mapfile -t files < <(find release-assets -type f)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"
