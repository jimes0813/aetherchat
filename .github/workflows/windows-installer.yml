name: publish-windows-installer

on:
  workflow_dispatch:

concurrency:
  group: publish-windows-installer
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  PYTHON_VERSION: '3.12'
  SOURCE_DATE_EPOCH: '1784160000'

jobs:
  windows-x64:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      AETHERCHAT_ALLOW_UNAUTHENTICATED: '1'
      WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      AETHERCHAT_REQUIRE_CODE_SIGNING: ${{ secrets.WINDOWS_CSC_LINK != '' && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend tests
        run: python -m pytest -q
      - name: Electron supply-chain tests
        working-directory: frontend
        run: npm run test:electron
      - name: Frontend unit and component tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Build Windows NSIS installer
        shell: pwsh
        run: frontend/build-windows.ps1
      - name: Verify install, upgrade, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/release/AetherChat-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }
          scripts/smoke_windows_install.ps1 $installer.FullName

      - name: Generate build metadata
        shell: pwsh
        run: |
          $version = node -p "require('./frontend/package.json').version"
          $installer = Get-ChildItem frontend/release/AetherChat-Setup-*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force release-meta | Out-Null
          python scripts/release_security.py sbom `
            --npm-lock frontend/package-lock.json `
            --requirements backend/requirements.txt `
            --version $version `
            --timestamp (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") `
            --output "release-meta/AetherChat-$version-windows-x64.cdx.json"
          python scripts/release_security.py metadata `
            --version $version `
            --platform windows `
            --arch x64 `
            --timestamp (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") `
            --artifact $installer.FullName `
            --output "release-meta/AetherChat-$version-windows-x64.build.json"
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $checksum = "$hash  $($installer.Name)`n"
          $encoding = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText(
            (Join-Path (Resolve-Path release-meta) "SHA256SUMS"),
            $checksum,
            $encoding
          )

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "windows-ci-latest"
          $repository = $env:GITHUB_REPOSITORY
          $version = node -p "require('./frontend/package.json').version"
          $installer = Get-ChildItem frontend/release/AetherChat-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }

          gh api "repos/$repository/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$repository/git/refs/tags/$tag" `
              -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
          } else {
            gh api --method POST "repos/$repository/git/refs" `
              -f ref="refs/tags/$tag" -f sha="$env:GITHUB_SHA" | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { throw "Unable to update release tag $tag" }

          $runUrl = "https://github.com/$repository/actions/runs/$env:GITHUB_RUN_ID"
          $commitUrl = "https://github.com/$repository/commit/$env:GITHUB_SHA"
          $notes = @"
          Automated unsigned Windows x64 installer for AetherChat $version.

          Validation: backend tests, Electron supply-chain tests, frontend production build,
          and silent install/upgrade/uninstall smoke test on Windows Server 2025.

          Source commit: $commitUrl
          GitHub Actions run: $runUrl

          This CI build is not Authenticode-signed. Windows SmartScreen may show a warning.

          Code signing policy: https://github.com/$repository/blob/main/CODE_SIGNING_POLICY.md
          Privacy policy: https://github.com/$repository/blob/main/PRIVACY.md
          "@

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repository `
              --title "AetherChat $version Windows CI" `
              --notes $notes `
              --prerelease | Out-Null
          } else {
            gh release create $tag --repo $repository `
              --verify-tag `
              --title "AetherChat $version Windows CI" `
              --notes $notes `
              --prerelease | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { throw "Unable to create or update release $tag" }

          $assets = @(
            $installer.FullName
            (Resolve-Path "release-meta/AetherChat-$version-windows-x64.cdx.json").Path
            (Resolve-Path "release-meta/AetherChat-$version-windows-x64.build.json").Path
            (Resolve-Path "release-meta/SHA256SUMS").Path
          )
          $blockmaps = @(
            Get-ChildItem frontend/release/*.blockmap -ErrorAction SilentlyContinue |
              ForEach-Object { $_.FullName }
          )
          $assets += $blockmaps
          gh release upload $tag @assets --repo $repository --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload Windows release assets" }

          $releaseUrl = gh release view $tag --repo $repository --json url --jq .url
          "### Windows installer published" >> $env:GITHUB_STEP_SUMMARY
          "- Release: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: $($installer.Name)" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $((Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant())" >> $env:GITHUB_STEP_SUMMARY
